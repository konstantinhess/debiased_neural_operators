[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "debiased-neural-operators-paper"
version = "1.0.0"
description = "Reproduction code for the debiased neural-operator experiments."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "pytorch-lightning>=2.2,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ono*"]

